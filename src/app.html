<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Leed Systems builds developer tools, automation utilities, and modern web application scaffolding." />

		<meta property="og:title" content="Leed Systems - Developer Tools & Automation" />
		<meta property="og:description" content="Developer tools and digital products focused on automation and clean project scaffolding." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://ctleed.github.io/leed-systems/" />
		<meta property="og:image" content="https://ctleed.github.io/leed-systems/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Leed Systems - Modern scaffolding and automation tools" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Leed Systems - Developer Tools & Automation" />
		<meta name="twitter:description" content="Developer tools and digital products focused on automation and clean project scaffolding." />
		<meta name="twitter:image" content="https://ctleed.github.io/leed-systems/og-image.png" />

		<!-- Additional SEO -->
		<meta name="author" content="Leed Systems" />
		<meta name="keywords" content="developer tools, automation, CLI utilities, project templates, scaffolding, web development" />
		<link rel="canonical" href="https://ctleed.github.io/leed-systems/" />

		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any">
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png">
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
